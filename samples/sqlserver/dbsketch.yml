provider: sqlserver
connectionString: "${DBSKETCH_SQLSERVER_CONNECTION}"

defaults:
  output:
    format: raw
  diagram:
    renderer: dot
    direction: LR
    columnLayout: "{name} | {keys}"

comments:
  enabled: false

diagrams:
  - name: dbo
    title: Database schema
    include:
      tables:
        - "dbo.*"
    exclude:
      tables:
        - "dbo.__EFMigrationsHistory"
    output:
      path: samples/output/sqlserver-dbo.dot
